  - "microservices"

upload_deletion:
  permanent_document_delete_role: SUPERADMIN
  permission: documents.delete
  type_filename_confirmation: false
  simple_confirmation_required: true
  direct_button_visible: true
  preserve_master_types_and_portal_pages: true
  local_purge_is_a_migration: false

removal_requests:
  draft_deletion: "owner ADMIN or SUPERADMIN with documents.edit; DRAF/REVISI only; preserve published versions; audit and physical files only after commit"
  template_management: "owner ADMIN only; SUPERADMIN global; verification queue remains cross-owner read-only"
  requesters: "active owner ADMIN; documents.edit or templates.manage"
  resources: [DOCUMENT, TEMPLATE]
  actions: [WITHDRAW, DELETE]
  decisions: "active SUPERADMIN with action permission; reasoned APPROVE or DECLINE; action and audit atomic"
  storage: "patch-024-permintaan-penghapusan; one pending per resource; durable snapshot without resource FK preserves deletion history"
  stale_requests: "current version must match snapshot; otherwise 409 and reasoned refusal/re-request"
  queue: "Antrean Verifikasi; Superadmin all, Admin own only; pending/history pagination and 30-second polling"
  direct_superadmin_action: "mark matching pending requests OBSOLETE in transaction"
  previously_published_templates: "deletion still requires Superadmin after withdrawal"

panel_choice_polish:
  access_selector: "native radios with sliding indicator, 240ms ease-out, keyboard focus and reduced motion; create/edit/template forms"
  document_status_requests_layout: "Admin: Status hukum beside requests; Superadmin: Status hukum beside Hapus permanen, requests full-width below both; mobile stacked; verification queue order unchanged"
  choice_spacing: "4px between menu choices, 8px menu inset, comfortable text padding; access focus inside segment and 6px control gutter"
  fields: "Jenis Dokumen, Unit Kerja/Kategori, account verification unit and Add Admin unit use shared animated Radix radio choice menu"
  motion: "180ms enter, 120ms exit, chevron rotation; prefers-reduced-motion removes motion; soft blue focus"
  relation_picker: "Pilih peraturan expands/collapses with CSS grid; focus input on open, return to trigger on close"
  action_icons: "decorative Lucide icons for edit/save/submit/approve/return/publish/revise/withdraw/delete; retain text and confirmation"

verification_notifications:
  queue_order: [Dokumen, Antrean Format Persuratan, Permintaan Penarikan & Penghapusan]
  removal_list_envelope: "sukses/data/meta at top level; do not double-wrap"
  pending_inbox: "eligible Superadmin: SUBMIT, TEMPLATE_SUBMIT, REMOVAL_REQUEST, ACCOUNT_REGISTER; current pending state only"
  owner_inbox: "Admin own approval/return/publish/withdraw/delete, template decisions/publication/removal and removal request decisions"
  safe_event_projection: "allowlisted business audit events; no raw audit data or audit.read permission granted"
  durable_deletion_receipt: "owner/title snapshot survives permanent deletion; request-backed action gives one decision receipt"
  identifiers: "workflow numeric IDs; business event e-<audit ID>; BIGINT strings throughout"
  dismiss_all_snapshot: "GET /admin/documents/notifications/snapshot; independent server maxima for both eligible sources, including outside visible 30; SQL UNSIGNED comparisons"
  dismissal: "per-account preferences; audit atomic; source workflow/audit retained; after-snapshot arrivals preserved"
  navigation: "format queue anchor, request-specific history and staff account group; deleted resources link to an available list/history"
  migration: "patch-025-notifikasi-fitur-panel after patch-024; additive and idempotent"
