backend_modules:
  - "auth"
  - "users"
  - "authorization"
  - "units"
  - "master"
  - "documents"
  - "document-files"
  - "workflow"
  - "legal-relations"
  - "secret-access"
  - "search"
  - "letter-templates"
  - "dashboard"
  - "audit"

deferred_v1:
  - "full-text PDF search"
  - "OCR"
  - "Meilisearch"
  - "JDIHN sync"
  - "external public API for third parties"
  - "news"
  - "articles"
  - "banner CMS"
  - "FAQ"
  - "dynamic menu CMS"
  - "contact/messages module"
  - "personal collections"
  - "public statistics page"
  - "legal services module"
