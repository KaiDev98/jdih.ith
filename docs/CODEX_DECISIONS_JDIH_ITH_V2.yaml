project:
  name: "JDIH ITH Parepare"
  institution: "Institut Teknologi Bacharuddin Jusuf Habibie"
  repo: "KaiDev98/jdih.ith"
  target_architecture: "modular-monolith"
  language: "id"

stack:
  backend: "NestJS + TypeScript"
  frontend: "Next.js + React + TypeScript"
  api: "REST /api/v1"
  validation: "Zod shared contracts"
  orm: "Drizzle"
  database: "MySQL 8"
  local_db_port: 3307
  storage_v1: "local"
  storage_future:
    - "S3"
    - "MinIO"

public_navigation:
  - "Beranda"
  - "Profil"
  - "Produk Hukum"
  - "Format Persuratan"
  - "Masuk"

public_home:
  statistics: false
  latest_public_document: true
  session_visibility: "anonymous/pending/inactive/invalid session: Public only; active staff and authorized managers: Public + Internal, across units"
  latest_and_counts_visibility: "same access predicate before ranking/counts/categories/years; current TERBIT only; special SOP collection remains separate"
  snapshot_privacy: "SSR forwards cookie with no-store; API private/no-store and Vary Cookie; separate in-flight coalescing by Public/Internal scope"
  profile_scope: "Tentang ITH"
  profile_source: "https://ith.ac.id/about; institutional introduction, 2014/2021 history, JDIH purpose and access guidance"
  footer_visits: "actual MySQL daily aggregates; browser/day WITA; server cookie and bot filter; no-store SSR; visible-tab refresh and day rollover; shared requests/Web Locks; unavailable state instead of invented zero"

document_collections_ui:
  collection_body_max_width: "1680px for Format Persuratan and SOP Permohonan SK; regular SOP uses the same 1280px frame as Produk Hukum"
  type_filter_switch: "clear category on a different type; preserve keyword/year/status; alternative type counts ignore category; active type count reflects actual results"
  regular_sop_scope: "peruntukan IS NULL; exclude PERMOHONAN_SK from general search, facets, years and home counts/latest; separate dedicated collection"
  format_public_layout: "folder cards; four desktop columns, up to three visible rows; bounded scrolling with incremental 12-item requests"
  sop_request_public_layout: "four desktop columns, up to three visible rows; two tablet columns, one mobile column; bounded scrolling and fully linked signature cards"
  mobile_collection_scroll: "bounded inner scrolling on Produk Hukum, Format Persuratan and SOP Permohonan SK"
  scroll_to_top: "mobile/tablet below 1024px only, public portal and authenticated panels; page and active list/panel; smooth with reduced-motion support; hidden on desktop"
  sop_request_detail_url: "/produk-hukum/[slug]?asal=permohonan-sk; canonical URL excludes query; return link follows collection"
  sop_request_help: "compact pale-blue contact bar titled Bantuan Pengajuan SK; real managed contact data"
  collection_page_search_bar: false
  collection_admin_search_bar: false
  all_documents_desktop: "fixed viewport; inner list scrolling; persistent filters and pagination"
  all_documents_collection_dropdown: [PRODUK_HUKUM, SOP, FORMAT, PERMOHONAN_SK]
  sop_request_admin_role: "ADMIN can upload/submit own; SUPERADMIN verifies and approves/publishes"
  collection_dropdown_style: "Radix radio menu; brief open/close animation; soft blue focus; keyboard and reduced motion"

auth:
  login_brand_alignment: "desktop >=1024px left-aligned; mobile/tablet centered"
  login_audience_separation: "staff /masuk has no role tabs; admin/superadmin login pages have only two adjacent manager tabs; registration remains staff-only /daftar"
  standalone_auth_pages: ["/masuk", "/daftar", "/masuk/admin", "/masuk/superadmin", "/lupa-password", "/atur-ulang-password"]
  auth_public_navbar_footer: false
  auth_visual_style: "2026-10-29 latest: desktop split layout with document/section symbols and contrasting typography on the left, login/registration on the right; no campus photo; compact form on mobile and short landscape; ITH palette"
  auth_page_scroll: false
  auth_registration_steps: [Identitas, Unit kerja, Keamanan]
  auth_desktop_frame_max: "1680x900"
  auth_desktop_form_max_width: 520
  auth_login_back_button: false
  auth_registration_back_button: true
  auth_registration_unit_picker: "animated Radix radio menu; scrollable units; keyboard/typeahead/Escape; preserves master/manual values and validation"
  auth_mobile_login_style: "navy masthead joined to white rounded form; role icons; compact short-screen layout"
  auth_registration_live_step_guide: true
  auth_registration_confirmation_summary: [nama, email, unit]
  auth_visual_viewport_keyboard_adaptation: true
  auth_keyboard_layout: "reuse pre-keyboard background geometry, card skin, brand, tabs and form spacing without a separate keyboard design; resize only the form scroll area; keep focused input visible; handle visual-only and layout resize"
  provider: "email/password + Google OAuth/OIDC"
  google_staff_domain: "@ith.ac.id"
  google_student_domain_denied: "@mahasiswa.ith.ac.id"
  staff_password_recovery: "SMTP TLS; staff-only; active/pending; generic response; 30-minute one-use token; hash at rest and encrypted outbox; reset revokes sessions without activation"
  password_recovery_mail_configuration: "private .env.mail.local or server env; Gmail App Password; unavailable UI until configured; never commit credentials"
  local_password_v1: true
  email_password_registration_domains: "any valid email domain"
  google_domain_required: "ith.ac.id"
  google_wildcard_allowed: false
  email_only_google_account_linking: false
  password_login_roles_are_separate: true
  new_staff_status: "MENUNGGU_VERIFIKASI"
  admin_approval_required: true
  admin_accounts_preprovisioned: true
  allow_admin_creation_in_ui: "SUPERADMIN active with users.read; fixed ADMIN/AKTIF; confirmation, CSRF and audit"
  allow_admin_promotion_in_ui: false
  account_verifier: "SUPERADMIN"
  registration_fields:
    - "name/email/password or verified Google identity"
    - "unit"
  nip_nidn_required: false
  allow_manual_unit_proposal: true

roles:
  canonical:
    - "SUPERADMIN"
    - "ADMIN"
    - "DOSEN_STAF"
    - "PENGUNJUNG"
  verifier: "SUPERADMIN"

admin_document_policy:
  can_create_documents: true
  can_edit_only_own_documents: true
  owner_source: "dokumen.created_by + dokumen_versi.created_by"
  can_submit_only_own_versions: true
  can_verify_or_publish: false
  can_manage_sop_permohonan_sk: "own drafts/uploads/submissions only"
  can_view_sop_permohonan_sk_in_panel: true
  can_view_audit: false
  sop_permohonan_sk_menu_visible: true
  verification_queue_read_scope: "legal/SOP and pending template queue read-only across authors; management remains owner-scoped; Superadmin alone can verify"
  category_scope: "categories mapped to the Admin account's unit"
  input_category_visibility: "Pilih kategori first clears selection; eligible active own-unit category second for Admin; other/inactive categories remain visible afterward but disabled; backend eligibility remains authoritative"
  category_required: false
  amendment_target_scope: "own document and own active published version; enforce search, relation POST and resubmission"
  global_menu_items_visible: true
  global_menu_items_disabled: false
  global_pages_readable: true
  global_write_controls_disabled: true
  global_write_exception: "Admin with templates.manage may manage own templates only; approval in Antrean Verifikasi, publication separate"
  can_manage_all_letter_templates: false
  letter_template_permission: "templates.manage"
  letter_template_verifier: "active SUPERADMIN only"
  admin_template_upload_status: "PENDING_REVIEW; both Admin and Superadmin uploads require approval then separate publication"
  document_input_options_unit_scoped: true
  account_email_visibility: "own email visible by session/target ID; other accounts masked in UI and API; Superadmin sees all"
  mask_own_email_in_admin_session_response: false
  preserve_original_email_for_internal_authentication: true

panel_routes:
  ADMIN: "/admin"
  SUPERADMIN: "/superadmin"
  api_namespace: "/api/v1/admin"
  document_detail_contexts: ["dokumen/:id", "dokumen/verifikasi/:id", "dokumen/pengajuan/:id"]
  preserve_document_version_and_source_list: true
  notification_document_navigation: "full-page link; SUBMIT -> verification, RETURN -> submissions, APPROVE -> verified"

panel_layout:
  dashboard_desktop: "at >=1024px: latest documents on the left filling remaining viewport height; actions and shortcuts on the right; independent inner scrolling, no page scrolling; mobile normal scroll"
  account_order: "Superadmin first, current Admin second, then newest; sort before API pagination"
  staff_account_columns: [Nama, Email, Peran, Unit, Status]
  staff_verification_entry: "Pengguna -> Buka verifikasi -> Tinjau; active Superadmin with decision permission only"
  template_workspace: "searchable list with status filters and responsive upload editor; preserve confirmation and permission checks"
  max_content_width_px: 1600
  desktop_sidebar_width_px: 240
  desktop_header_height_px: 56
  detail_preview_before_history: true
  bounded_history_and_table_scroll: true
  master_desktop_layout: "full workspace width; fixed viewport; Jenis Dokumen card fits content up to available height, long lists scroll internally; Kategori SOP keeps full height; mobile normal page scroll"
  touch_target_minimum_px: 44
  respects_reduced_motion: true
  animations_without_extra_dependencies: true

superadmin_document_policy:
  dashboard_audit_activity_visible: false
  dashboard_requests_audit_feed: false
  can_manage_all_documents: true
  can_verify_all_documents: true
  can_manage_sop_permohonan_sk: true
  can_manage_global_settings: true
  audit_reader: "active SUPERADMIN with audit.read; Admin direct permission does not grant access"

document_access:
  levels:
    - "publik"
    - "internal"
    - "rahasia"
  removed_levels:
    - "terbatas"
  publik:
    anonymous_search: "full summary"
    anonymous_detail: true
    anonymous_download: true
  internal:
    anonymous_search: "title + INTERNAL badge"
    anonymous_detail: false
    anonymous_download: false
    active_staff_detail: true
    active_staff_download: true
    unit_scoped: false
  rahasia:
    anonymous_search: false
    public_discoverable: false
    active_staff_requires_explicit_grant: true
    unauthorized_direct_response: 404
    audit_sensitive_access: true

document_workflow:
  states:
    - "DRAF"
    - "DIAJUKAN"
    - "REVISI"
    - "DISETUJUI"
    - "TERBIT"
    - "DITARIK"
  rejected_state: false
  author_can_approve_own_version: "only active Superadmin with workflow.approve, owning both document and version"
  sop_permohonan_sk_approval: "APPROVE -> DISETUJUI only; separate PUBLISH -> TERBIT with reviewed impact confirmation; includes own Superadmin uploads"
  sop_permohonan_sk_access: [publik, internal]
  own_superadmin_draft_flow: "DRAF/REVISI -> DISETUJUI, without SUBMIT/verification queue; full readiness and audit required"
  return_revision_requires_note: true
  approval_requires_note: false
  submission_required_metadata: [judul, deskripsi, nomor, tahun, pic, tanggal_penetapan, tingkat_akses]
  optional_submission_category: "empty allowed including SOP Permohonan SK; selected categories must match Admin unit; version unit still assigned from account"
  submission_requires_valid_main_file: true
  admin_all_documents_states: [DISETUJUI, TERBIT, DITARIK]
  draft_submission_list_states: [DRAF, REVISI, DIAJUKAN]
  verification_queue_states: [DIAJUKAN]
  verification_queue_refresh: "focus, workflow event, every 30 seconds when visible, and manual refresh"
  notifications: "Superadmin: latest SUBMIT per version while DIAJUKAN only; Admin: own APPROVE/RETURN with reason; resubmission creates new incoming event; panel polling 30s"
  notification_dismissal: "per-account notifikasi_dihapus; single/all with confirmation and audit; all uses ID snapshot cutoff; workflow/audit preserved"
  publish_transactional: true
  write_actions_require_confirmation_popup: true
  publish_required_version_metadata: [judul, nomor, pic, tanggal_penetapan]
  withdrawal_current_pointer: null
  withdrawal_auto_reactivate_superseded: false
  withdrawal_preserves_history: true

legal:
  statuses:
    - "BERLAKU"
    - "DIUBAH"
    - "DICABUT"
  relations:
    - "MENGUBAH"
    - "MENCABUT"
    - "DASAR_HUKUM"
    - "TERKAIT"
  relation_status_impact:
    MENGUBAH: "DIUBAH"
    MENCABUT: "DICABUT"
    DASAR_HUKUM: null
    TERKAIT: null
  auto_apply_without_human_confirmation: false
  withdrawal_rolls_back_target_status: false

product_detail_v1:
  fields:
    Tipe: "jenis_dokumen.nama"
    Judul: "dokumen_versi.judul"
    Nomor: "dokumen_versi.nomor"
    Tanggal Penetapan: "dokumen_versi.tanggal_penetapan"
    Status: "dokumen.status_hukum"
    PIC: "dokumen_versi.pic"
  pic: {type: "VARCHAR(255)", free_text: true, foreign_key: false, versioned: true}
  tanggal_penetapan: {type: "DATE", versioned: true}
  abstrak_in_schema: false
  extended_bpk_metadata: false
  tahun_retained_for_search: true
  tahun_detail_row: false
  files_from: "current_published_version"
  authorized_file_actions: [Preview, Download]
  same_detail_format_for_all_authorized_access_levels: true

secret_grants:
  expired_grants_give_access: false
  unique_slot: "dokumen_id + pengguna_id where revoked_at IS NULL"
  regrant_transaction: "lock document then user; close expired row; insert new grant; audit; commit"
  preserve_history: true
  nondeterministic_generated_columns: false

product_types:
  - "Peraturan Rektor"
  - "SK Rektor"
  - "Instruksi Rektor"
  - "Surat Edaran Rektor"
  - "SOP"

sop_initial_categories:
  - "Jurusan Sains"
  - "Jurusan TPI"
  - "Perpustakaan"
  - "TIK"
  - "Akademik & Kemahasiswaan"
  - "BMN"
  - "Kepegawaian"
  - "Keuangan"
  - "LPPM-PM"
  - "Bagian Hukum"
  - "SPI"
  - "Komisi Etik Kemahasiswaan"
  - "Laboratorium"
  - "Senat"

sop_unit_sync:
  source: "kategori"
  preserve_existing_ids_on_rename: true
  lppm_code: "SOP-LPPM"
  komisi_kemahasiswaan_removed: true
  preserve_komisi_etik: true

search_v1:
  keyword_fields:
    - "judul"
    - "nomor"
    - "tahun"
    - "jenis"
    - "kategori"
    - "tag"
  filters:
    - "jenis"
    - "tahun"
    - "unit"
    - "kategori"
    - "status_hukum"
  pdf_fulltext: false
  ocr: false
  meilisearch: false

document_files:
  main_file_required: true
  multiple_attachments: false
  maximum_files_per_submission: 1
  preserve_historical_attachments: true
  unpublished_file_review: "active panel account with documents.read_admin; Superadmin reviews before verification"
  access_recheck_on_download: true
  access_recheck_on_preview: true
  checksum: true
  stream_download: true

versioning:
  stable_entity: "dokumen"
  version_entity: "dokumen_versi"
  current_pointer: "dokumen.current_published_version_id"
  keep_old_versions: true
  supersede_old_version: true
  draft_revision_replaces_public_immediately: false

letter_templates:
  upload_slug_collision: "initial upload modeSlug defaults manual; manual collision returns generic 409 with guidance; automatic mode retries UNIQUE parent insert up to five times with UUID suffix <=191 characters; deleted slugs stay reserved, no old URL reuse; actual slug audited"
  public_layout: "three desktop columns, server search, 12 items per page; access-filtered totals"
  module: "Format Persuratan"
  primary_format_v1: ".docx"
  ui_columns: [Judul, Pratinjau, Download]
  title_source: "template_surat.nama"
  detail_page_v1: false
  preview_v1: "native PDF via authorized inline API/blob dialog; unsupported Office uses download; no third-party viewer"
  legal_metadata_v1: false
  internal_requires_active_staff: true
  access_levels:
    - "PUBLIK"
    - "INTERNAL"
  versioning: true
  old_version_behavior: "ARCHIVED"
  version_statuses: [PENDING_REVIEW, APPROVED, ACTIVE, ARCHIVED]
  admin_upload_requires_verification: true
  verifier: "active SUPERADMIN only"
  pending_versions_per_template: 1
  active_version_kept_until_publication: true
  approval_publishes_automatically: false
  superadmin_upload_requires_own_approval: true
  approval_metadata: [verified_by, approved_at]
  publish_verifies_file_checksum: true
  hard_delete_normal_history: false
  manual_removal: "DELETE /admin/letter-templates/:id; active owner Admin only while unpublished/unapproved; active Superadmin any owner/state with templates.manage"
  removal_transaction: "lock parent; deleted_at + active=0 + current pointer NULL + audit DELETE; preserve versions/files; no bulk purge"
  deleted_template_access: "absent from panel/public lists; downloads/review/new versions/approval/publication denied"
  manager: "owner ADMIN only; SUPERADMIN any owner; templates.manage required; only SUPERADMIN approves and publishes separately"
  approval_location: "Antrean Verifikasi: pending queue visible across authors with pagination and preview/download; no approval button in template manager"
  cross_owner_review: "active panel readers may use queue-specific preview/download while PENDING_REVIEW only; normal management API remains owner-scoped"
  approved_version_admin_mutability: false

master_creation:
  kategori: false
  jenis_dokumen: false
  existing_master_editing: "Superadmin with master.manage; input choices preserved; no data deletion"

popup_rule:
  visual_style: "white surface, subtle accent, light translucent backdrop, short motion; Radix portal with focus management"
  write_actions_require_confirmation: true
  success_feedback: true
  error_feedback: true
  navigation_requires_confirmation: false
  search_requires_confirmation: false

